<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Люблю тебя</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0b1e3a, #1c3f66, #4a7fa5, #bfe3f0);
    background-size: 300% 300%;
    animation: bgshift 14s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
    overflow: hidden;
    position: relative;
  }

  @keyframes bgshift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- floating snow background ---------- */
  .heart-float {
    position: absolute;
    top: -40px;
    color: rgba(255,255,255,0.8);
    animation: snowFall linear infinite;
    pointer-events: none;
    user-select: none;
  }

  @keyframes snowFall {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(110vh) translateX(var(--drift)) rotate(360deg); opacity: 0; }
  }

  /* ---------- envelope ---------- */
  .envelope-wrap {
    cursor: pointer;
    position: relative;
    width: 260px;
    height: 180px;
    transition: transform 0.4s ease, opacity 0.5s ease;
  }

  .envelope-wrap:hover { transform: scale(1.04) translateY(-4px); }

  .envelope-wrap.hidden {
    opacity: 0;
    transform: scale(0.7);
    pointer-events: none;
  }

  .envelope-body {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #eaf6fb, #cfe9f5);
    border-radius: 10px;
    box-shadow: 0 20px 40px rgba(0,20,40,0.45);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.5);
  }

  .envelope-flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, #8fc6e0, #5fa3c7);
    clip-path: polygon(0 0, 50% 55%, 100% 0);
    transform-origin: top;
    transition: transform 0.7s cubic-bezier(.68,-0.4,.27,1.4);
    z-index: 3;
  }

  .envelope-wrap.open .envelope-flap {
    transform: rotateX(180deg);
  }

  .envelope-shadow-tri-left,
  .envelope-shadow-tri-right {
    position: absolute;
    bottom: 0;
    width: 0; height: 0;
    border-style: solid;
  }
  .envelope-shadow-tri-left {
    left: 0;
    border-width: 90px 0 0 130px;
    border-color: transparent transparent transparent rgba(0,0,0,0.06);
  }
  .envelope-shadow-tri-right {
    right: 0;
    border-width: 90px 130px 0 0;
    border-color: transparent rgba(0,0,0,0.06) transparent transparent;
  }

  .envelope-heart {
    position: absolute;
    top: 66%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 34px;
    z-index: 4;
    animation: pulse 1.4s ease-in-out infinite;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.18); }
  }

  .hint {
    position: absolute;
    bottom: -42px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .letter-pop {
    position: absolute;
    top: -18px;
    left: 8px;
    right: 8px;
    height: 60%;
    background: #fffdf7;
    border-radius: 8px 8px 2px 2px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    transform: translateY(0) scale(0.9);
    opacity: 0;
    transition: transform 0.6s 0.35s cubic-bezier(.2,.8,.2,1.2), opacity 0.4s 0.35s;
    z-index: 2;
  }
  .envelope-wrap.open .letter-pop {
    transform: translateY(-70px) scale(1);
    opacity: 1;
  }

  /* ---------- main card ---------- */
  .card {
    position: absolute;
    max-width: 460px;
    width: 90%;
    background: rgba(235, 248, 255, 0.9);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 22px;
    padding: 40px 32px 34px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,15,35,0.45);
    opacity: 0;
    transform: scale(0.7) translateY(40px);
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(.2,.8,.2,1.2);
    pointer-events: none;
  }

  .card.show {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }

  .card h1 {
    font-size: 30px;
    background: linear-gradient(90deg, #2f6f9e, #6fc3e8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
    animation: wiggle 2.4s ease-in-out infinite;
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-1.5deg); }
    75% { transform: rotate(1.5deg); }
  }

  .card p.sub {
    color: #3b5a70;
    font-size: 15px;
    margin-bottom: 26px;
    line-height: 1.5;
  }

  .btn-row {
    position: relative;
    display: flex;
    gap: 16px;
    justify-content: center;
    min-height: 60px;
    align-items: center;
  }

  button {
    border: none;
    border-radius: 30px;
    padding: 13px 28px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }

  #yesBtn {
    background: linear-gradient(90deg, #3d8fc0, #7fd0ec);
    color: #fff;
    box-shadow: 0 8px 18px rgba(63,143,192,0.4);
  }
  #yesBtn:hover { transform: scale(1.08); }
  #yesBtn:active { transform: scale(0.96); }

  #noBtn {
    background: #dceefa;
    color: #2f5670;
    position: relative;
    transition: transform 0.18s ease;
  }

  .final {
    display: none;
  }
  .final.show { display: block; }

  .final-anim {
    font-size: 34px;
    font-weight: 700;
    line-height: 1.4;
  }

  .final-anim .letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(14px) scale(0.7);
    animation: letterIn 0.5s forwards;
    background: linear-gradient(90deg, #2f6f9e, #7fd0ec, #bfe3f0, #2f6f9e);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  @keyframes letterIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .final-emoji {
    font-size: 46px;
    margin-top: 14px;
    opacity: 0;
    animation: emojiPop 0.6s 0.4s forwards;
  }

  @keyframes emojiPop {
    0% { opacity: 0; transform: scale(0.3) rotate(-20deg); }
    60% { opacity: 1; transform: scale(1.2) rotate(6deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .hearts-burst {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 999;
  }

  .burst-heart {
    position: absolute;
    font-size: 20px;
    animation: burstUp 1.6s ease-out forwards;
  }

  @keyframes burstUp {
    0% { transform: translateY(0) scale(0.4) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-420px) scale(1.2) rotate(300deg); opacity: 0; }
  }

  .easter-egg {
    margin-top: 22px;
    font-size: 13px;
    color: #999;
    cursor: pointer;
    text-decoration: underline dotted;
    display: inline-block;
  }

  .secret-box {
    margin-top: 14px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s ease;
    font-size: 14px;
    color: #2f6f9e;
    font-weight: 600;
  }
  .secret-box.open {
    max-height: 100px;
  }

  @media (max-width: 480px) {
    .envelope-wrap { width: 220px; height: 155px; }
    .card { padding: 32px 22px 28px; }
    .card h1 { font-size: 25px; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="envelope-wrap" id="envelope">
    <div class="envelope-body">
      <div class="letter-pop"></div>
      <div class="envelope-shadow-tri-left"></div>
      <div class="envelope-shadow-tri-right"></div>
      <div class="envelope-flap"></div>
      <div class="envelope-heart">💌</div>
    </div>
    <div class="hint">нажми, чтобы открыть свой подарочек ✨</div>
  </div>

  <div class="card" id="card">
    <div id="mainScreen">
      <h1>Я тебя люблю ❤️</h1>
      <p class="sub">Насколько сильно ты хочешь послать меня нахуй?</p>
      <div class="btn-row">
        <button id="yesBtn" onclick="sayYes()">блять, с начала ты должна нажать на нет</button>
        <button id="noBtn" onclick="dodge(event)" ontouchstart="dodge(event)">Нет</button>
      </div>
      <span class="easter-egg" id="egg" onclick="toggleSecret()">🤫 нажми сюда, если знаешь секрет</span>
      <div class="secret-box" id="secretBox">Ты сейчас нашёл(-ла) пасхалку, а не отговорку 😏</div>
    </div>

    <div class="final" id="finalScreen">
      <div class="final-anim" id="finalAnim"></div>
      <div class="final-emoji">💕✨💖</div>
    </div>
  </div>

</div>

<script>
const stage = document.getElementById('stage');
const envelope = document.getElementById('envelope');
const card = document.getElementById('card');
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const mainScreen = document.getElementById('mainScreen');
const finalScreen = document.getElementById('finalScreen');
const finalAnim = document.getElementById('finalAnim');
const secretBox = document.getElementById('secretBox');

let dodgeCount = 0;
let yesScale = 1;
let gaveUp = false;

const funnyLines = [
  "Ну куда 😏",
  "А если подумать? 🤔",
  "Серьёзно, идти нахуй? 🙄",
  "Даже не пытайся, я холодная 😌",
  "Кнопка неуловима как Максим на самокате 🏃",
  "Всё равно не поймаешь ✋",
  "Ладно, последний шанс...",
  "Так, стоп...",
];

function makeHearts(n) {
  for (let i = 0; i < n; i++) {
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = ['❄️','❅','❆','✦','·'][Math.floor(Math.random()*5)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.setProperty('--drift', (Math.random()*160-80) + 'px');
    h.style.animationDuration = (7 + Math.random()*8) + 's';
    h.style.animationDelay = (Math.random()*6) + 's';
    h.style.fontSize = (10 + Math.random()*18) + 'px';
    stage.appendChild(h);
  }
}
makeHearts(30);

envelope.addEventListener('click', () => {
  if (envelope.classList.contains('open')) return;
  envelope.classList.add('open');
  setTimeout(() => {
    envelope.classList.add('hidden');
    card.classList.add('show');
  }, 650);
});

function dodge(e) {
  if (gaveUp) return;
  dodgeCount++;

  if (dodgeCount > funnyLines.length) {
    giveUp();
    return;
  }

  const maxDx = Math.min(100, window.innerWidth * 0.22);
  const maxDy = Math.min(35, window.innerHeight * 0.05);
  const dx = Math.random() * maxDx * 2 - maxDx;
  const dy = Math.random() * maxDy * 2 - maxDy;
  noBtn.style.transform = `translate(${dx}px, ${dy}px)`;

  const idx = dodgeCount - 1;
  noBtn.textContent = funnyLines[idx];

  yesScale = Math.min(1.6, 1 + dodgeCount * 0.06);
  yesBtn.style.transform = `scale(${yesScale})`;
}

function giveUp() {
  gaveUp = true;
  noBtn.style.transform = 'translate(0, 0)';
  noBtn.textContent = 'блять, ну всё, сдаюсь';
  noBtn.style.pointerEvents = 'none';
  noBtn.style.background = '#e5e5ea';

  yesBtn.textContent = 'Да';
}

function sayYes() {
  mainScreen.style.display = 'none';
  finalScreen.classList.add('show');
  showFinal(gaveUp);
  burstHearts();
}

function showFinal(fromGiveUp) {
  const text = fromGiveUp
    ? 'вот видишь, всё равно любовь победила ❤️'
    : (dodgeCount === 0
        ? 'я знал(а), что ты это скажешь 🎉'
        : `после ${dodgeCount} побегов кнопки «нет» — ты всё равно здесь 🥰`);

  finalAnim.innerHTML = '';
  [...text].forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'letter';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (i * 0.035) + 's';
    finalAnim.appendChild(span);
  });
}

function burstHearts() {
  const layer = document.createElement('div');
  layer.className = 'hearts-burst';
  document.body.appendChild(layer);

  const emojis = ['❄️','✨','💙','❅'];
  for (let i = 0; i < 40; i++) {
    const h = document.createElement('div');
    h.className = 'burst-heart';
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left = (45 + Math.random()*10) + 'vw';
    h.style.bottom = (10 + Math.random()*10) + 'vh';
    h.style.animationDelay = (Math.random()*0.5) + 's';
    h.style.fontSize = (16 + Math.random()*18) + 'px';
    layer.appendChild(h);
  }
  setTimeout(() => layer.remove(), 2400);
}

function toggleSecret() {
  secretBox.classList.toggle('open');
}
</script>

</body>
</html>
